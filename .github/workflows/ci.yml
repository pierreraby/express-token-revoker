name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Root scripts run `pnpm -r` — build & test cover all packages
      # (core, server, node) in topological order.
      - name: Type check & build (all packages)
        run: pnpm build

      - name: Tests (all packages)
        run: pnpm test

      # server/node are private (PD-3) — the packaging smoke test stays
      # core-only.
      - name: Packaging smoke test
        run: pnpm --filter express-token-revoker exec npm pack --dry-run
