syntax = "proto3";

// import "google/protobuf/empty.proto";

package revoker;

service RevokerAdmin {
  rpc Add (AddRequest) returns (AddResponse) {}
  rpc Has (HasRequest) returns (HasResponse) {}
  rpc GetMetrics (GetMetricsRequest) returns (GetMetricsResponse) {}
  rpc ResetAndRestore (ResetAndRestoreRequest) returns (ResetAndRestoreResponse) {}
  rpc ResetAndClearData (ResetAndClearDataRequest) returns (ResetAndClearDataResponse) {}
  rpc ListRevokers (ListRevokersRequest) returns (ListRevokersResponse) {} 
}

message AddRequest {
  string revokerId = 1;
  string item = 2;
}

message AddResponse {
  bool success = 1;
  string message = 2;
}

message HasRequest {
  string revokerId = 1;
  string item = 2;
}

message HasResponse {
  bool exists = 1;
}

message GetMetricsRequest {
  string revokerId = 1;
}

message GetMetricsResponse {
  EstimatedMetrics estimatedMetrics = 1;
  Configuration configuration = 2;
}

message EstimatedMetrics {
  int32 currentCount = 1;
  int32 previousCount = 2;
  float currentFpRate = 3;
  float previousFpRate = 4;
}

message Configuration {
  int32 numItems = 1;
  float fpRate = 2;
  int32 rotateTime = 3;
  bool backupEnabled = 4;
  int32 backupTime = 5;
}

message ResetAndRestoreRequest {
  string revokerId = 1;
}

message ResetAndRestoreResponse {
  bool success = 1;
  string message = 2;
}

message ResetAndClearDataRequest {
  string revokerId = 1;
}

message ResetAndClearDataResponse {
  bool success = 1;
  string message = 2;
}

message ListRevokersRequest {}

message ListRevokersResponse {
  repeated string revokerIds = 1;
}